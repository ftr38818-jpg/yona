name: Yonaguni - disponibilites

on:
  schedule:
    - cron: '2-59/5 * 1-8 10 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Commencer par diagnostic, puis notification, puis monitor'
        type: choice
        options:
          - diagnostic
          - notification
          - monitor
        default: diagnostic
        required: true

permissions:
  contents: write

concurrency:
  group: yonaguni-single-monitor
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MODE: ${{ github.event.inputs.mode || 'monitor' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Stop if the target date has passed
        id: gate
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          config = json.load(open('config.json'))
          active = datetime.now(ZoneInfo('Europe/Paris')).date() <= date.fromisoformat(config['target_date'])
          active = active or os.environ['MODE'] == 'notification'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"active={str(active).lower()}\n")
          if not active:
              print('Target date passed. No website visit.')
          PY

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the tested Playwright version
        if: steps.gate.outputs.active == 'true'
        run: python -m pip install -r requirements.txt

      - name: Restore Chromium cache
        id: browser-cache
        if: steps.gate.outputs.active == 'true' && env.MODE != 'notification'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium and system dependencies
        if: steps.gate.outputs.active == 'true' && env.MODE != 'notification'
        run: python -m playwright install --with-deps chromium --only-shell

      - name: Run selected mode
        if: steps.gate.outputs.active == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python monitor.py --mode "$MODE"

      - name: Diagnostic evidence - no cookies or HAR archive
        if: always() && env.MODE == 'diagnostic' && steps.gate.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yonaguni-diagnostic-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 1
